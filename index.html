<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Сканер</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: #0d0d0f; --fg: #f3f3f3; --muted: #9a9aa2; --accent: #e5322d; --ok: #2ecc71; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px 16px 16px; gap: 12px; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  #status { color: var(--muted); font-size: 14px; min-height: 20px; }
  #status.ok { color: var(--ok); } #status.err { color: #ff6b6b; }
  .cam { position: relative; flex: 1; min-height: 240px; border-radius: 14px; overflow: hidden; background: #000; }
  #reader { width: 100%; height: 100%; }
  #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
  .row { display: flex; gap: 8px; }
  button, input { font: inherit; border-radius: 10px; border: 0; padding: 12px 14px; }
  button { background: #26262b; color: var(--fg); }
  button.main { background: var(--accent); color: #fff; }
  input { flex: 1; min-width: 0; background: #1b1b1f; color: var(--fg); border: 1px solid #2c2c33; }
  #torch { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📷 Сканер посылок</h1>
  <div id="status">Запускаю камеру…</div>
  <div class="cam"><div id="reader"></div></div>
  <div class="row">
    <button id="torch" type="button">🔦 Фонарик</button>
    <button id="restart" type="button">🔄 Камера</button>
  </div>
  <form class="row" id="manual">
    <input id="code" inputmode="text" autocomplete="off" placeholder="Или введите трек вручную">
    <button class="main" type="submit">OK</button>
  </form>
</div>

<script>
// Библиотека чтения штрихкодов: основной адрес и запасной
function loadLib(urls, done) {
  if (!urls.length) return done(false);
  var s = document.createElement("script");
  s.src = urls[0];
  s.onload = function () { done(true); };
  s.onerror = function () { s.remove(); loadLib(urls.slice(1), done); };
  document.head.appendChild(s);
}

var tg = window.Telegram && window.Telegram.WebApp;
var inTelegram = !!(tg && tg.initData);
var statusEl = document.getElementById("status");
var scanner = null, sent = false, last = "", lastAt = 0;

function status(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; }

if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#0d0d0f"); tg.setBackgroundColor("#0d0d0f"); } catch (e) {} }

// Отдаём код боту. Telegram сам закроет окно, а бот пришлёт карточку товара.
function finish(code) {
  code = String(code || "").trim();
  if (!code || sent) return;
  sent = true;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  status("✅ " + code, "ok");
  var stop = scanner ? scanner.stop().catch(function () {}) : Promise.resolve();
  stop.then(function () {
    if (inTelegram) tg.sendData(code.slice(0, 500));
    else { sent = false; status("✅ " + code + " (вне Telegram — только показ)", "ok"); }
  });
}

function onCode(text, result) {
  var fmt = result && result.result && result.result.format ? result.result.format.formatName : "";
  // Линейный штрихкод иногда читается с ошибкой — ждём два одинаковых прочтения подряд
  var now = Date.now();
  if (fmt !== "QR_CODE" && fmt !== "DATA_MATRIX" && !(text === last && now - lastAt < 2000)) {
    last = text; lastAt = now;
    return;
  }
  finish(text);
}

function start() {
  if (!scanner) {
    var F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode("reader", {
      verbose: false, useBarCodeDetectorIfSupported: true,
      formatsToSupport: [F.QR_CODE, F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8,
                         F.UPC_A, F.UPC_E, F.ITF, F.CODABAR, F.DATA_MATRIX]
    });
  }
  status("Наведите камеру на штрихкод или QR на наклейке");
  scanner.start({ facingMode: "environment" }, {
    fps: 12,
    qrbox: function (w, h) { return { width: Math.floor(w * 0.9), height: Math.floor(Math.min(w, h) * 0.55) }; }
  }, onCode, function () {}).then(function () {
    try {
      var caps = scanner.getRunningTrackCapabilities();
      if (caps && caps.torch) document.getElementById("torch").style.display = "";
    } catch (e) {}
  }).catch(function (e) {
    status("Нет доступа к камере. Разрешите камеру для Telegram в настройках телефона и нажмите «🔄 Камера». "
           + "Или введите трек вручную.", "err");
  });
}

var torchOn = false;
document.getElementById("torch").onclick = function () {
  if (!scanner) return;
  torchOn = !torchOn;
  scanner.applyVideoConstraints({ advanced: [{ torch: torchOn }] }).catch(function () {});
};
document.getElementById("restart").onclick = function () {
  sent = false;
  var stop = scanner && scanner.isScanning ? scanner.stop().catch(function () {}) : Promise.resolve();
  stop.then(start);
};
document.getElementById("manual").onsubmit = function (e) {
  e.preventDefault();
  finish(document.getElementById("code").value);
};

loadLib(["https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js",
         "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"], function (ok) {
  if (ok) start();
  else status("Не загрузилась камера (нет интернета?). Введите трек вручную.", "err");
});
</script>
</body>
</html>
